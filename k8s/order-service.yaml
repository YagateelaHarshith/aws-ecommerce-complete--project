# ═══════════════════════════════════════════════════════════════════
# Order Service — Kubernetes Deployment + Service + HPA
# ═══════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
    tier: backend
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        tier: backend
    spec:
      serviceAccountName: order-service-sa  # For IRSA
      containers:
        - name: order-service
          image: 699037166170.dkr.ecr.us-east-1.amazonaws.com/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
              name: http
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: AWS_REGION
            - name: DYNAMODB_ORDERS_TABLE
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: ORDERS_TABLE
            - name: USER_SERVICE_URL
              value: "http://user-service:8001"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8002"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      protocol: TCP
      port: 8003
      targetPort: 8003
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
