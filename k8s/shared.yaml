# ═══════════════════════════════════════════════════════════════════
# Shared Kubernetes Resources
# Namespace, ConfigMap, Secrets template, ServiceAccounts (IRSA)
# ═══════════════════════════════════════════════════════════════════

# ── Namespace ─────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  labels:
    name: ecommerce
    environment: production

---
# ── ConfigMap: Shared non-sensitive configuration ─────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  AWS_REGION: "us-east-1"
  PRODUCTS_TABLE: "products"
  ORDERS_TABLE: "orders"
  PRODUCT_IMAGES_BUCKET: "ecommerce-product-images"
  ENVIRONMENT: "production"

---
# ── Secret: User Service sensitive config (populate before deploy) ──
# Replace base64 values with: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secrets
  namespace: ecommerce
type: Opaque
data:
  COGNITO_USER_POOL_ID: dXMtZWFzdC0xXzZEZ3I0bFl6Rg==
  COGNITO_CLIENT_ID: NmVtMHN1bXBtbTk1aWV2YWhoYjhqMTJ1bm4=
  COGNITO_CLIENT_SECRET: MThtMzl0c2NqdXR0MHI2cDRkOXBzOWZkOW81NmVybTdkZzdoaWJwdjVwbDMzYmFwZHFkMA==

---
# ── ServiceAccount: User Service (IRSA) ───────────────────────────
# Annotate with IAM Role ARN for Cognito access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service-sa
  namespace: ecommerce
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::699037166170:role/user-service-role

---
# ── ServiceAccount: Product Service (IRSA) ────────────────────────
# IAM Role needs: DynamoDB (products table) + S3 (product images bucket)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service-sa
  namespace: ecommerce
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::699037166170:role/product-service-role

---
# ── ServiceAccount: Order Service (IRSA) ──────────────────────────
# IAM Role needs: DynamoDB (orders table)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: ecommerce
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::699037166170:role/order-service-role
